name: Build iOS App

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - prod_release

jobs:
  build-ios:
    name: Build iOS (Unsigned .ipa)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App
        run: |
          flutter build ios --release --no-codesign --dart-define=API_BASE_URL=https://rootly-backend-tyf2.onrender.com

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -q Rootly-iOS-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rootly-iOS-unsigned
          path: Rootly-iOS-unsigned.ipa
          retention-days: 14
